{% extends "hotel/base.html" %}
{% block title %}Форма категории{% endblock %}
{% block content %}
<h1>Форма категории номера</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <p>{{ field.label_tag }}<br>{{ field }}<br>{{ field.errors }}</p>
    {% endfor %}
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
