{% extends "hotel/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <p>
            {{ field.label_tag }}<br>
            {{ field }}<br>
            {{ field.errors }}
        </p>
    {% endfor %}
    <button type="submit">Войти</button>
</form>
{% endblock %}
